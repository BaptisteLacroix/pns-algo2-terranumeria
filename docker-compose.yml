services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: baptistelacroix/terranumeria-backend:v2
    environment:
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - ./backend/conversations:/app/conversations
      - ./backend/profiles:/app/profiles
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: baptistelacroix/terranumeria-frontend:v2
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  node_modules:
